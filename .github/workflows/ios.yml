name: ForgeSign iOS

on:
  push:
    branches: [main]
    # Pushing a version tag (e.g. v2.7) also publishes the GitHub release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Check formatting
        run: git diff --check

      - name: Test IPA packaging
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Select available simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone|iPad/ {print $2; exit}')
          test -n "$DEVICE_ID"
          echo "SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Run simulator tests
        run: |
          xcodebuild test \
            -project ForgeSignMobile.xcodeproj \
            -scheme ForgeSignMobileTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build device Release target
        run: |
          xcodebuild build \
            -project ForgeSignMobile.xcodeproj \
            -scheme ForgeSignMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ci-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          python3 scripts/package_ipa.py pack \
            build/ci-derived/Build/Products/Release-iphoneos/ForgeSign.app \
            build/ForgeSign-latest.ipa

      - name: Validate current IPA structure
        run: |
          test -f build/ForgeSign-latest.ipa
          unzip -t build/ForgeSign-latest.ipa
          python3 scripts/package_ipa.py validate build/ForgeSign-latest.ipa
          unzip -Z1 build/ForgeSign-latest.ipa | grep -Fx 'Payload/ForgeSign.app/ForgeSign'
          ! unzip -Z1 build/ForgeSign-latest.ipa | grep -E '\.(debug\.dylib|preview\.dylib)$'

      - name: Name the IPA after its version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          test -n "$VERSION"
          cp build/ForgeSign-latest.ipa "build/ForgeSign-$VERSION.ipa"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Every run keeps the unsigned IPA it built, so a PR or manual run can be
      # downloaded from the run's Artifacts section and signed for testing.
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ForgeSign-${{ steps.version.outputs.version }}-unsigned-ipa
          path: build/ForgeSign-${{ steps.version.outputs.version }}.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ForgeSign-${{ needs.validate.outputs.version }}-unsigned-ipa

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $VERSION"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "ForgeSign-$VERSION.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ForgeSign $VERSION" \
            --notes "Unsigned IPA — sign it with your own certificate and provisioning profile before installing. Changes: see “What’s new in $VERSION” in README.md."
