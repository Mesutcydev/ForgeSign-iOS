name: ForgeSign iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Check formatting
        run: git diff --check

      - name: Select available simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone|iPad/ {print $2; exit}')
          test -n "$DEVICE_ID"
          echo "SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Run simulator tests
        run: |
          xcodebuild test \
            -project ForgeSignMobile.xcodeproj \
            -scheme ForgeSignMobileTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build device Release target
        run: |
          xcodebuild build \
            -project ForgeSignMobile.xcodeproj \
            -scheme ForgeSignMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ci-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          rm -rf build/ci-ipa
          mkdir -p build/ci-ipa/Payload
          ditto build/ci-derived/Build/Products/Release-iphoneos/ForgeSign.app build/ci-ipa/Payload/ForgeSign.app
          (cd build/ci-ipa && zip -qry ../ForgeSign-latest.ipa Payload)

      - name: Validate current IPA structure
        run: |
          test -f build/ForgeSign-latest.ipa
          unzip -t build/ForgeSign-latest.ipa
          test "$(unzip -Z1 build/ForgeSign-latest.ipa | grep -c '^Payload/[^/]*/$')" -eq 1
          unzip -Z1 build/ForgeSign-latest.ipa | grep -Fx 'Payload/ForgeSign.app/ForgeSign'
          ! unzip -Z1 build/ForgeSign-latest.ipa | grep -E '\.(debug\.dylib|preview\.dylib)$'
