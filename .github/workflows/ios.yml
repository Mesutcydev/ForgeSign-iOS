name: ForgeSign iOS

on:
  push:
    branches: [main, 'release/**']
    # A version tag (e.g. v2.8.2) also publishes the validated IPA.
    tags: ['v*']
  pull_request:
  # Run manually on main to publish the Info.plist version when its tag
  # can't be pushed directly; the release job then creates v<version> at
  # the validated commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $VERSION"
            exit 1
          fi

      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Install build and native test dependencies
        run: brew install xcodegen openssl@3

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Prepare checksum-pinned signing dependencies
        run: python3 scripts/prepare_dependencies.py

      - name: Generate project
        run: xcodegen generate

      - name: Check formatting
        # Checks the committed change against main, not an empty working tree (audit B3).
        run: git diff --check origin/main...HEAD

      - name: Test IPA packaging
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test native signing invariants
        run: |
          bash scripts/test_signer_identity.sh
          bash scripts/test_signer_resources.sh
          bash scripts/test_crypto.sh

      - name: Build the bridge probe
        run: bash scripts/build_bridge_probe.sh

      - name: Sign and verify generated fixtures
        run: |
          FORGESIGN_OPENSSL="$(brew --prefix openssl@3)/bin/openssl" python3 scripts/test_signing_fixture.py

      - name: Select available simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone|iPad/ {print $2; exit}')
          test -n "$DEVICE_ID"
          echo "SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Run simulator tests
        run: |
          xcodebuild test \
            -project ForgeSignMobile.xcodeproj \
            -scheme ForgeSignMobileTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build device Release target
        run: |
          xcodebuild build \
            -project ForgeSignMobile.xcodeproj \
            -scheme ForgeSignMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ci-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          python3 scripts/package_ipa.py pack \
            build/ci-derived/Build/Products/Release-iphoneos/ForgeSign.app \
            build/ForgeSign-latest.ipa

      - name: Validate current IPA structure
        run: |
          test -f build/ForgeSign-latest.ipa
          unzip -t build/ForgeSign-latest.ipa
          python3 scripts/package_ipa.py validate build/ForgeSign-latest.ipa
          unzip -Z1 build/ForgeSign-latest.ipa | grep -Fx 'Payload/ForgeSign.app/ForgeSign'
          listing=$(unzip -Z1 build/ForgeSign-latest.ipa)
          if printf '%s\n' "$listing" | grep -Eq '\.(debug\.dylib|preview\.dylib)$'; then
            echo "::error::Debug dylibs must not be packaged"
            exit 1
          fi

      - name: Upload validated unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ForgeSign-latest
          path: build/ForgeSign-latest.ipa
          if-no-files-found: error
          retention-days: 14

  # Publishes the IPA this run validated. A published release is never replaced
  # (audit B1): re-running the same build is a no-op, a different build under the
  # same version fails and the version must be bumped.
  release:
    needs: validate
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    # One publish at a time per ref, and never cancelled midway (audit B8).
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish the validated IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist", "rb"))["CFBundleShortVersionString"])')"
            # A manual run may create the tag at this commit, but never moves an
            # existing one. Only a missing tag (HTTP 404) is a reason to create it (audit B2).
            if EXISTING=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/tmp/tag-error); then
              if [ "$EXISTING" != "$GITHUB_SHA" ]; then
                echo "::error::$TAG already points at $EXISTING, not $GITHUB_SHA"
                exit 1
              fi
            elif ! grep -q "HTTP 404" /tmp/tag-error; then
              echo "::error::Could not read $TAG: $(cat /tmp/tag-error)"
              exit 1
            fi
          fi
          VERSION="${TAG#v}"
          # The build number must increase over the previous release (audit B7).
          BUILD=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist", "rb"))["CFBundleVersion"])')
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          if [ -n "$PREVIOUS" ] && git show "$PREVIOUS:Info.plist" > previous.plist 2>/dev/null; then
            PREVIOUS_BUILD=$(python3 -c 'import plistlib; print(plistlib.load(open("previous.plist", "rb"))["CFBundleVersion"])')
            if [ "$BUILD" -le "$PREVIOUS_BUILD" ]; then
              echo "::error::Build $BUILD does not increase on $PREVIOUS ($PREVIOUS_BUILD)"
              exit 1
            fi
          fi
          gh run download "$GITHUB_RUN_ID" --name ForgeSign-latest --dir release
          test -f release/ForgeSign-latest.ipa
          cp release/ForgeSign-latest.ipa "release/ForgeSign-$VERSION.ipa"
          (cd release && shasum -a 256 ForgeSign-latest.ipa "ForgeSign-$VERSION.ipa" > SHA256SUMS.txt)
          # Only this version's notes are published, never the whole history (audit B7).
          python3 scripts/release_notes.py "$VERSION" --source WHATS_NEW.md --output release/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p published
            gh release download "$TAG" --pattern SHA256SUMS.txt --dir published
            PUBLISHED=$(awk '$2 == "ForgeSign-latest.ipa" {print $1}' published/SHA256SUMS.txt)
            BUILT=$(awk '$2 == "ForgeSign-latest.ipa" {print $1}' release/SHA256SUMS.txt)
            if [ -n "$PUBLISHED" ] && [ "$PUBLISHED" = "$BUILT" ]; then
              echo "$TAG is already published with this exact build. Nothing to replace."
            else
              echo "::error::$TAG is already published with a different build. Bump the version instead of replacing it."
              exit 1
            fi
          else
            gh release create "$TAG" release/ForgeSign-latest.ipa "release/ForgeSign-$VERSION.ipa" release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "ForgeSign $VERSION" \
              --notes-file release/notes.md
          fi
