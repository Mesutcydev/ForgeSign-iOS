name: ForgeSignMobile
options:
  bundleIdPrefix: com.forgesign
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    ENABLE_DEBUG_DYLIB: "NO"

packages:
  AltSign:
    # Prepared from checksum-pinned upstream source by scripts/prepare_dependencies.py.
    path: vendor/AltSign

targets:
  ForgeSignMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Bridge
      - path: vendor/zsign
        excludes:
          - "zsign.cpp"
          - "third-party/minizip/iowin32.c"
          - "third-party/minizip/iowin32.h"
          - "third-party/minizip/mztools.c"
          - "third-party/minizip/mztools.h"
          # AltSign supplies the same minizip ABI. Compile it only once to
          # avoid duplicate symbols while keeping zsign's headers unchanged.
          - "third-party/minizip/ioapi.c"
          - "third-party/minizip/unzip.c"
          - "third-party/minizip/zip.c"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgesign.mobile
        PRODUCT_NAME: ForgeSign
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/ForgeSignBridge.h
        # $(inherited) keeps DEBUG in Debug builds, so the `#if DEBUG`
        # self-checks also compile into device Debug builds.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FORGE_BRIDGE
        CLANG_CXX_LANGUAGE_STANDARD: c++11
        CLANG_CXX_LIBRARY: libc++
        GCC_C_LANGUAGE_STANDARD: gnu11
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/vendor/zsign
          - $(SRCROOT)/vendor/zsign/common
          - $(SRCROOT)/vendor/zsign/third-party/zlib
          - $(SRCROOT)/vendor/openssl/OpenSSL.xcframework/ios-arm64/OpenSSL.framework/Headers
        SWIFT_OPTIMIZATION_LEVEL: -Onone
        GCC_PREPROCESSOR_DEFINITIONS:
          - ZSIGN_VERSION=0.1.0
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: AltSign
        product: AltSign-Dynamic
        embed: true
      - package: AltSign
        product: OpenSSL
        # SwiftPM already embeds its transitive binary framework. XcodeGen's
        # explicit product copy would look for a nonexistent wrapper product.
        embed: false

  ForgeSignMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ForgeSignUISim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgesign.mobile.tests
        PRODUCT_NAME: ForgeSignMobileTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # Lightweight UI-preview/test target: SwiftUI/App without the signing bridge
  # or Apple Account package. Signing is stubbed (see SigningService), but
  # layout, navigation and the Sources/repo networking all run in the simulator.
  # Safe to delete if you don't want a simulator preview build.
  ForgeSignUISim:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgesign.mobile.uisim
        PRODUCT_NAME: ForgeSignUISim
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  ForgeSignMobile:
    build:
      targets:
        ForgeSignMobile: all

  ForgeSignUISim:
    build:
      targets:
        ForgeSignUISim: all
    run:
      config: Debug

  ForgeSignMobileTests:
    build:
      targets:
        ForgeSignUISim: all
        ForgeSignMobileTests: [test]
    test:
      config: Debug
      targets:
        - name: ForgeSignMobileTests
